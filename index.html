<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мультиплеер MQTT (3–5 игроков)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #12151c; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
  h1 { font-size: 1.5rem; margin-bottom: 12px; color: #38bdf8; }
  .panel { background: #1e2430; border: 1px solid #2d3748; border-radius: 10px; padding: 16px; width: 100%; max-width: 820px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input, select, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #4a5568; background: #0f131a; color: #fff; font-size: 0.95rem; }
  button { background: #0284c7; border-color: #0284c7; cursor: pointer; font-weight: 600; transition: 0.15s; }
  button:hover:not(:disabled) { background: #0369a1; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.danger { background: #dc2626; border-color: #dc2626; }
  .status { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; background: #334155; }
  .status.ok { background: #15803d; color: #dcfce7; }
  .status.err { background: #b91c1c; color: #fee2e2; }
  .grid { display: grid; grid-template-columns: 1fr 240px; gap: 16px; width: 100%; max-width: 820px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  canvas { background: #0b0e14; border: 2px solid #334155; border-radius: 10px; width: 100%; height: 420px; display: block; }
  .sidebar { background: #1e2430; border: 1px solid #2d3748; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .player-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; background: #0f131a; border-radius: 6px; font-size: 0.9rem; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .chat-box { flex: 1; min-height: 140px; max-height: 180px; overflow-y: auto; background: #0f131a; padding: 8px; border-radius: 6px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px; }
  .hint { font-size: 0.8rem; color: #94a3b8; margin-top: 8px; }
</style>
</head>
<body>

<h1>MQTT Мультиплеер (3–5 игроков)</h1>

<div class="panel">
  <div class="row" style="margin-bottom: 10px;">
    <input id="nickInput" type="text" placeholder="Ваш ник" maxlength="14" style="width: 150px;">
    <input id="roomInput" type="text" placeholder="Код комнаты" value="room-35" maxlength="20" style="width: 140px;">
    <select id="brokerSelect">
      <option value="wss://broker.hivemq.com:8884/mqtt">HiveMQ Cloud (WSS)</option>
      <option value="wss://broker.emqx.io:8084/mqtt">EMQX Public (WSS)</option>
      <option value="wss://test.mosquitto.org:8081/mqtt">Mosquitto Test (WSS)</option>
    </select>
    <button id="connectBtn">Войти в комнату</button>
    <button id="leaveBtn" class="danger" disabled>Выйти</button>
    <span id="connStatus" class="status">Отключено</span>
  </div>
  <div class="hint">
    Управление: <b>WASD</b> или <b>Стрелки</b>. Вместимость комнаты: до <b>5 человек</b> (оптимально 3–5). Исправлены рассинхронизация координат, дублирование сессий и зависание вышедших игроков (LWT + heartbeat).
  </div>
</div>

<div class="grid">
  <div>
    <canvas id="arena" width="560" height="420"></canvas>
  </div>
  <div class="sidebar">
    <div>
      <div style="font-weight: 600; margin-bottom: 6px;">Игроки (<span id="playerCount">0</span>/5)</div>
      <div id="playerList" style="display: flex; flex-direction: column; gap: 6px;"></div>
    </div>
    <div style="display: flex; flex-direction: column; flex: 1;">
      <div style="font-weight: 600; margin-bottom: 6px;">Чат комнаты</div>
      <div id="chatBox" class="chat-box"></div>
      <div class="row" style="margin-top: 6px;">
        <input id="chatInput" type="text" placeholder="Сообщение..." style="flex: 1; min-width: 0;" disabled>
        <button id="sendBtn" disabled>OK</button>
      </div>
    </div>
  </div>
</div>

<!-- Минималистичный встроенный MQTT 3.1.1 over WebSocket клиент без внешних зависимостей -->
<script>
class MiniMQTT {
  constructor(url, options = {}) {
    this.url = url;
    this.clientId = options.clientId || ('mp_' + Math.random().toString(16).slice(2, 10));
    this.keepAlive = options.keepAlive || 15;
    this.will = options.will || null;
    this.ws = null;
    this.packetId = 1;
    this.handlers = {};
    this.pingTimer = null;
    this.connected = false;
  }

  on(event, fn) { this.handlers[event] = fn; }
  emit(event, ...args) { if (this.handlers[event]) this.handlers[event](...args); }

  encodeStr(str) {
    const bytes = new TextEncoder().encode(str);
    return [bytes.length >> 8, bytes.length & 0xff, ...bytes];
  }

  encodeRemLen(len) {
    const out = [];
    do {
      let byte = len % 128;
      len = Math.floor(len / 128);
      if (len > 0) byte |= 0x80;
      out.push(byte);
    } while (len > 0);
    return out;
  }

  connect() {
    this.ws = new WebSocket(this.url, 'mqtt');
    this.ws.binaryType = 'arraybuffer';

    this.ws.onopen = () => {
      let flags = 0x02; // Clean session
      if (this.will) {
        flags |= 0x04; // Will flag
        if (this.will.qos === 1) flags |= 0x08;
        if (this.will.retain) flags |= 0x20;
      }
      const varHeader = [
        0x00, 0x04, 0x4d, 0x51, 0x54, 0x54, // "MQTT"
        0x04, // Level 3.1.1
        flags,
        this.keepAlive >> 8, this.keepAlive & 0xff
      ];
      let payload = [...this.encodeStr(this.clientId)];
      if (this.will) {
        payload.push(...this.encodeStr(this.will.topic));
        payload.push(...this.encodeStr(this.will.payload));
      }
      const remLen = this.encodeRemLen(varHeader.length + payload.length);
      this.sendRaw(new Uint8Array([0x10, ...remLen, ...varHeader, ...payload]));
    };

    this.ws.onmessage = (evt) => this.handleBytes(new Uint8Array(evt.data));
    this.ws.onerror = (err) => this.emit('error', err);
    this.ws.onclose = () => {
      this.connected = false;
      clearInterval(this.pingTimer);
      this.emit('close');
    };
  }

  sendRaw(uint8) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
      this.ws.send(uint8);
    }
  }

  handleBytes(buf) {
    let i = 0;
    while (i < buf.length) {
      const header = buf[i++];
      const type = header >> 4;
      let mult = 1, remLen = 0, byte = 0;
      do {
        byte = buf[i++];
        remLen += (byte & 127) * mult;
        mult *= 128;
      } while ((byte & 128) !== 0);

      const end = i + remLen;
      if (type === 2) { // CONNACK
        if (buf[i + 1] === 0) {
          this.connected = true;
          this.pingTimer = setInterval(() => this.sendRaw(new Uint8Array([0xc0, 0x00])), this.keepAlive * 500);
          this.emit('connect');
        } else {
          this.emit('error', new Error('CONNACK code: ' + buf[i + 1]));
        }
      } else if (type === 3) { // PUBLISH
        const qos = (header >> 1) & 0x03;
        const tLen = (buf[i] << 8) | buf[i + 1];
        const topic = new TextDecoder().decode(buf.slice(i + 2, i + 2 + tLen));
        let pStart = i + 2 + tLen;
        if (qos > 0) {
          const pid = (buf[pStart] << 8) | buf[pStart + 1];
          pStart += 2;
          if (qos === 1) this.sendRaw(new Uint8Array([0x40, 0x02, pid >> 8, pid & 0xff]));
        }
        const msg = new TextDecoder().decode(buf.slice(pStart, end));
        this.emit('message', topic, msg);
      }
      i = end;
    }
  }

  subscribe(topic) {
    if (!this.connected) return;
    const pid = this.packetId++;
    const payload = [pid >> 8, pid & 0xff, ...this.encodeStr(topic), 0x00];
    this.sendRaw(new Uint8Array([0x82, ...this.encodeRemLen(payload.length), ...payload]));
  }

  publish(topic, message, retain = false) {
    if (!this.connected) return;
    const header = 0x30 | (retain ? 0x01 : 0x00);
    const payload = [...this.encodeStr(topic), ...new TextEncoder().encode(message)];
    this.sendRaw(new Uint8Array([header, ...this.encodeRemLen(payload.length), ...payload]));
  }

  disconnect() {
    clearInterval(this.pingTimer);
    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
      this.sendRaw(new Uint8Array([0xe0, 0x00]));
      this.ws.close();
    }
  }
}
</script>

<script>
const MAX_PLAYERS = 5;
const COLORS = ['#38bdf8', '#f43f5e', '#22c55e', '#f59e0b', '#a855f7'];
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');

const nickInput = document.getElementById('nickInput');
const roomInput = document.getElementById('roomInput');
const brokerSelect = document.getElementById('brokerSelect');
const connectBtn = document.getElementById('connectBtn');
const leaveBtn = document.getElementById('leaveBtn');
const connStatus = document.getElementById('connStatus');
const playerCountEl = document.getElementById('playerCount');
const playerListEl = document.getElementById('playerList');
const chatBox = document.getElementById('chatBox');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

nickInput.value = 'Игрок_' + Math.floor(100 + Math.random() * 900);

let mqtt = null;
let myId = 'p_' + Math.random().toString(36).slice(2, 9);
let roomPrefix = '';
let players = {}; // id -> { id, name, x, y, tx, ty, color, joinedAt, lastSeen }
let keys = {};
let syncTimer = null;
let cleanupTimer = null;
let animFrame = null;

function setStatus(text, cls = '') {
  connStatus.textContent = text;
  connStatus.className = 'status ' + cls;
}

function addChat(author, text, sys = false) {
  const div = document.createElement('div');
  if (sys) {
    div.style.color = '#94a3b8';
    div.textContent = '* ' + text;
  } else {
    div.innerHTML = `<b style="color:#38bdf8">${escapeHtml(author)}:</b> ${escapeHtml(text)}`;
  }
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderSidebar() {
  const list = Object.values(players).sort((a, b) => a.joinedAt - b.joinedAt);
  playerCountEl.textContent = list.length;
  playerListEl.innerHTML = '';
  list.forEach((p, idx) => {
    const color = COLORS[idx % COLORS.length];
    p.color = color;
    const item = document.createElement('div');
    item.className = 'player-item';
    item.innerHTML = `
      <span><span class="dot" style="background:${color}"></span>${escapeHtml(p.name)} ${p.id === myId ? '(Вы)' : ''}</span>
      <span style="font-size:0.75rem;color:#64748b">#${idx + 1}</span>
    `;
    playerListEl.appendChild(item);
  });
}

function connectRoom() {
  const nick = nickInput.value.trim() || 'Игрок';
  const room = roomInput.value.trim().replace(/[^a-zA-Z0-9_-]/g, '') || 'room-35';
  const brokerUrl = brokerSelect.value;

  roomPrefix = `mp_game_v2/${room}`;
  myId = 'p_' + Math.random().toString(36).slice(2, 9);
  players = {};

  const now = Date.now();
  players[myId] = {
    id: myId,
    name: nick,
    x: 100 + Math.random() * 360,
    y: 100 + Math.random() * 220,
    tx: 0,
    ty: 0,
    color: COLORS[0],
    joinedAt: now,
    lastSeen: now
  };
  players[myId].tx = players[myId].x;
  players[myId].ty = players[myId].y;

  setStatus('Подключение...', '');
  connectBtn.disabled = true;

  mqtt = new MiniMQTT(brokerUrl, {
    clientId: 'client_' + myId,
    keepAlive: 10,
    will: {
      topic: `${roomPrefix}/leave/${myId}`,
      payload: JSON.stringify({ id: myId, name: nick }),
      qos: 1,
      retain: false
    }
  });

  mqtt.on('connect', () => {
    setStatus('В сети (' + room + ')', 'ok');
    leaveBtn.disabled = false;
    chatInput.disabled = false;
    sendBtn.disabled = false;
    nickInput.disabled = true;
    roomInput.disabled = true;
    brokerSelect.disabled = true;

    mqtt.subscribe(`${roomPrefix}/#`);
    // Очищаем возможный старый retained-топик нашему ID и объявляем вход
    mqtt.publish(`${roomPrefix}/join`, JSON.stringify({
      id: myId,
      name: nick,
      x: Math.round(players[myId].x),
      y: Math.round(players[myId].y),
      joinedAt: players[myId].joinedAt
    }));
    addChat('', `Вы вошли в комнату "${room}"`, true);
    renderSidebar();
    startLoops();
  });

  mqtt.on('message', (topic, raw) => {
    let data;
    try { data = JSON.parse(raw); } catch { return; }

    if (topic === `${roomPrefix}/join`) {
      if (data.id === myId) return;
      const activeCount = Object.keys(players).length;
      if (!players[data.id] && activeCount >= MAX_PLAYERS) {
        // Сообщаем новому игроку, что комната заполнена (5/5)
        mqtt.publish(`${roomPrefix}/full/${data.id}`, JSON.stringify({ max: MAX_PLAYERS }));
        return;
      }
      const isNew = !players[data.id];
      players[data.id] = {
        id: data.id,
        name: data.name || 'Игрок',
        x: data.x || 280,
        y: data.y || 210,
        tx: data.x || 280,
        ty: data.y || 210,
        joinedAt: data.joinedAt || Date.now(),
        lastSeen: Date.now()
      };
      if (isNew) addChat('', `${players[data.id].name} присоединился`, true);
      // Отправляем новичку свои текущие координаты
      const me = players[myId];
      if (me) {
        mqtt.publish(`${roomPrefix}/state/${myId}`, JSON.stringify({
          id: myId, name: me.name, x: Math.round(me.x), y: Math.round(me.y), joinedAt: me.joinedAt
        }));
      }
      renderSidebar();
    }
    else if (topic.startsWith(`${roomPrefix}/state/`)) {
      if (data.id === myId) return;
      if (!players[data.id]) {
        if (Object.keys(players).length >= MAX_PLAYERS) return;
        players[data.id] = {
          id: data.id,
          name: data.name || 'Игрок',
          x: data.x,
          y: data.y,
          tx: data.x,
          ty: data.y,
          joinedAt: data.joinedAt || Date.now(),
          lastSeen: Date.now()
        };
        renderSidebar();
      } else {
        players[data.id].tx = data.x;
        players[data.id].ty = data.y;
        players[data.id].name = data.name || players[data.id].name;
        players[data.id].lastSeen = Date.now();
      }
    }
    else if (topic.startsWith(`${roomPrefix}/leave/`)) {
      if (players[data.id]) {
        addChat('', `${players[data.id].name} покинул игру`, true);
        delete players[data.id];
        renderSidebar();
      }
    }
    else if (topic === `${roomPrefix}/full/${myId}`) {
      addChat('', `Комната заполнена (максимум ${MAX_PLAYERS} игроков).`, true);
      leaveRoom();
    }
    else if (topic === `${roomPrefix}/chat`) {
      addChat(data.name, data.text);
    }
  });

  mqtt.on('error', () => {
    setStatus('Ошибка брокера', 'err');
  });

  mqtt.on('close', () => {
    cleanupUI();
  });

  mqtt.connect();
}

function leaveRoom() {
  if (mqtt && mqtt.connected && players[myId]) {
    mqtt.publish(`${roomPrefix}/leave/${myId}`, JSON.stringify({ id: myId, name: players[myId].name }));
  }
  if (mqtt) mqtt.disconnect();
  cleanupUI();
}

function cleanupUI() {
  clearInterval(syncTimer);
  clearInterval(cleanupTimer);
  cancelAnimationFrame(animFrame);
  setStatus('Отключено', '');
  connectBtn.disabled = false;
  leaveBtn.disabled = true;
  chatInput.disabled = true;
  sendBtn.disabled = true;
  nickInput.disabled = false;
  roomInput.disabled = false;
  brokerSelect.disabled = false;
  players = {};
  renderSidebar();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function startLoops() {
  let lastSentX = -1, lastSentY = -1, lastHeartbeat = 0;

  // Отправка координат 15 раз в секунду при движении + heartbeat раз в 2 секунды
  syncTimer = setInterval(() => {
    const me = players[myId];
    if (!me || !mqtt || !mqtt.connected) return;
    const rx = Math.round(me.x);
    const ry = Math.round(me.y);
    const now = Date.now();
    if (rx !== lastSentX || ry !== lastSentY || now - lastHeartbeat > 2000) {
      lastSentX = rx;
      lastSentY = ry;
      lastHeartbeat = now;
      mqtt.publish(`${roomPrefix}/state/${myId}`, JSON.stringify({
        id: myId, name: me.name, x: rx, y: ry, joinedAt: me.joinedAt
      }));
    }
  }, 66);

  // Удаление "зависших" игроков без пакетов более 6 секунд
  cleanupTimer = setInterval(() => {
    const now = Date.now();
    let changed = false;
    for (const id of Object.keys(players)) {
      if (id !== myId && now - players[id].lastSeen > 6000) {
        addChat('', `${players[id].name} отключился по таймауту`, true);
        delete players[id];
        changed = true;
      }
    }
    if (changed) renderSidebar();
  }, 1500);

  let prevTime = performance.now();
  function loop(now) {
    const dt = Math.min((now - prevTime) / 1000, 0.1);
    prevTime = now;
    update(dt);
    draw();
    animFrame = requestAnimationFrame(loop);
  }
  animFrame = requestAnimationFrame(loop);
}

function update(dt) {
  const me = players[myId];
  if (me) {
    const speed = 220;
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
    if (dx !== 0 && dy !== 0) {
      const inv = 1 / Math.SQRT2;
      dx *= inv; dy *= inv;
    }
    me.x = Math.max(18, Math.min(canvas.width - 18, me.x + dx * speed * dt));
    me.y = Math.max(18, Math.min(canvas.height - 18, me.y + dy * speed * dt));
  }

  // Плавная интерполяция позиций остальных игроков
  for (const id of Object.keys(players)) {
    if (id === myId) continue;
    const p = players[id];
    p.x += (p.tx - p.x) * Math.min(1, dt * 15);
    p.y += (p.ty - p.y) * Math.min(1, dt * 15);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Сетка арены
  ctx.strokeStyle = '#161d2b';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // Отрисовка игроков
  Object.values(players).forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
    ctx.fillStyle = p.color || '#38bdf8';
    ctx.fill();
    if (p.id === myId) {
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }

    ctx.font = '600 12px system-ui, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, p.x, p.y - 22);
  });
}

function sendChat() {
  const text = chatInput.value.trim();
  if (!text || !mqtt || !mqtt.connected || !players[myId]) return;
  mqtt.publish(`${roomPrefix}/chat`, JSON.stringify({
    id: myId,
    name: players[myId].name,
    text: text.slice(0, 120)
  }));
  chatInput.value = '';
}

window.addEventListener('keydown', e => {
  if (document.activeElement === chatInput || document.activeElement === nickInput || document.activeElement === roomInput) return;
  keys[e.code] = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('beforeunload', () => leaveRoom());

connectBtn.addEventListener('click', connectRoom);
leaveBtn.addEventListener('click', leaveRoom);
sendBtn.addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
</script>
</body>
</html>
